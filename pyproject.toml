[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dial-control"
version = "0.1.0"
description = "Reproducibility code for dispersive interaction via analytical linear inversion (DIAL)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
]

[tool.setuptools.packages.find]
where = ["src"]
