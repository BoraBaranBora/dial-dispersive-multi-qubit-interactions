[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dial-control"
version = "0.1.0"
description = "Target-Aware DIAL control synthesis and publication reproducibility code"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "numba",
]

[tool.setuptools.packages.find]
where = ["src"]
